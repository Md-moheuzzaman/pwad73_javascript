<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Question 1: Trainee Data</h2>
    <script>
        function getData(){
            let name = document.myform.name.value;
            let contact = document.myform.contact.value;
            let remarks = document.myform.remarks.value;
            let gender = document.myform.gender.value;
            let location = document.myform.location.value;
            
            //alert(location);
            let output = "";
            output += "Name:" + name + "<br>";


            let mywin = window.open("","", "height:300,width:300");
            mywin.document.write(output);
        }

    </script>

    <form name="myform">
        <input type="text" name="name" placeholder="Enter Name" id=""> <br> <br>
        <input type="text" name="contact" placeholder="Enter Phone" id=""> <br> <br>
        <textarea name="remarks" id="" placeholder="Remarks"></textarea> <br> <br>
        <input type="radio" name="gender" value="male">Male
        <input type="radio" name="gender" value="female">Female <br> <br>
        <input type="checkbox" class="course" value="NT">NT
        <input type="checkbox" class="course" value="IAD">IAD
        <input type="checkbox" class="course" value="DDD">DDD
        <input type="checkbox" class="course" value="ESAD">ESAD
        <br> <br>
        <select name="location" id="">
            <option >Location</option>
            <option >BANANi</option>
            <option >Dhanmondi</option>
            <option >Mirpur</option>
        </select> <br> <br>
        <button type="button" onclick="getData()">Submit</button>
        <!-- <button type="reset">Reset</button> -->
        
    </form>
</body>
