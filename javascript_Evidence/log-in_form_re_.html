<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Log-in Form</h3>
    <div id="show"></div>
    <form action="" name="myform" onsubmit= "return validation()">
        <input type="text" required name="email" id="" placeholder="Enter Email"> <br>
        <input type="password" name="password" id="" placeholder="Enter password"> <br>
        <input type="submit"  name="submit" id="" value="SUBMIT">
    </form>
    <script>
        function validation(){
          
            let username = document.myform.username.value;
            let password = document.myform.password.value;
          if(username.length < 6 ){
            alert("username At Least 6 character");
            return false;
          }
          if(password.length > 8){
            alert("Password must be within 8 character")
            return false;
          }
        }
    </script>
</body>
</html>
