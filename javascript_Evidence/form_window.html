<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .blue {
        background-color: aqua;

      }
    </style>
  </head>
  <body>
    
    <form action="" name="myform">
      <input type="text" name="name" placeholder="Full Name" /><br />
      <textarea name="address" placeholder="Enter Address"></textarea> <br>
      <input type="email" name="email" placeholder="Enter Email" id="">
      <br />
      <input type="button" onclick="mywindow()" name="submit" value="OPEN" />
      <input type="button" onclick="mywindow.close()" name="close" value="CLOSE">
    </form>
    <div id="show"></div>
    <script>
      function mywindow() {
      let name = document.myform.name.value;
      let address = document.myform.address.value;
      let email = document.myform.email.value;
      let output = "<div class = 'blue'>";
        output += name + "<br>";
        output += address + "<br>";
        output += email + "<br>";
        output += "</div>";
        //document.getElementById("show").innerHTML = output;
       mywindow =  window.open("", "", "height:300", "width:600");
       mywindow.document.write(output);
      }
        
    </script>
  </body>
</html>
