<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function OddOrEven(){
        let number = prompt("please Enter a Number");
        number = parseInt(number);
       
            if (number % 2 == 0) {
                alert ("Your Provided number " + number +" is Even.")
                

            } else {
                alert ("Your Provided number " + number +" is Odd.")
            }
        }
   
    </script>
</head>
<body>
    <button onclick="OddOrEven()">Click

    </button>
</body>
</html>
