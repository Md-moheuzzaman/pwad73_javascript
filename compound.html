<html>
  <head>
    <title>Compound Structure</title>
    <script language="JavaScript">
      var counter = 0; //Sequence
      var endIt = 15;
      while (counter < endIt) {
        //Loop begins
        if (counter == 7) {
          //Conditional begins
          alert("You are half way through");
        } //Conditional ends
        counter++;
      } //Loop ends
      var message = "Counter value is now:" + counter;
      document.write(message);
    </script>
  </head>
</html>
