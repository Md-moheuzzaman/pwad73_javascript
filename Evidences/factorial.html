<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num = parseInt(prompt("Enter a number:", ""));

        function myfact(n){
            let fact = 1;
            for(let i = 1; i<=n; i++){
                fact = fact * i;
            }
            document.write("Factorial of " + n + " is: " + fact);
        }
        myfact(num);
    </script>
</body>
</html>
