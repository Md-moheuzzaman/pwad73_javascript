<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>prompt</title>
</head>
<body>
    <h2>Get user data </h2>
    <script>
        let num1 = window.prompt("Insert a number", "");
        let num2 = window.prompt("Insert a number", "");

        num1 = parseInt(num1);
        num2 = parseInt(num2);

        let sum =num1 + num2;
        document.write(sum);
    </script>
    
</body>
</html>
