<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>1 to 20</h3>
    <script>
        for(let i = 1; i<=20; i++){
            if(i==15){
            document.write("Fifteen" + "<br>");
            continue;
            }
            document.write(i + "<br>");
        }
        
    </script>
</body>
</html>
