<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sortArray</title>
</head>
<body>
    <script>
        const zoo = new Array("Zebras", "Lions", "Apes", "Tiger");
        document.write(zoo);
        document.write("<br>");
        zoo.reverse();
        document.write("<br>");
        document.write(zoo);
        document.write("<br>");
        document.write("<br>");

        const numbers = [10,62,11,23,34,55,44];
        document.write(numbers);
        document.write("<br>");
        numbers.reverse();
        document.write("<br>");
        document.write(numbers);
    </script>
</body>
</html>
