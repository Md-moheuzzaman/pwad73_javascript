<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3 id="show"></h3>
    <script>

        const person = {
            name:"Touhid",
            age: 23,
            address: "Mirpur",
            city: "Dhaka",
        };

        let info = 
        "Name: " +
        person.name +
        "<br>Age: " +
        person.age +
        "<br>City: " +
        person.city +
        "<br> Address: " +
        person.address;
        document.getElementById("show").innerHTML = info;
    </script>
</body>
</html>
